name: sohba
description: "صحبة — رفيقك على طريق الطاعة"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---------- UI ----------
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.3.0
  confetti: ^0.7.0
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  intl: ^0.20.2
  collection: ^1.15.0
  characters: ^1.4.0

  # ---------- State ----------
  provider: ^6.0.5

  # ---------- Backend ----------
  supabase_flutter: ^2.5.0

  # ---------- Prayer ----------
  adhan: ^2.0.0

  # ---------- Local ----------
  shared_preferences: ^2.2.0

  # ---------- Config ----------
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/backgrounds/
    - assets/athkar/
    - .env