name: sohba
description: "صحبة — رفيقك على طريق الطاعة"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---------- UI ----------
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.3.0
  confetti: ^0.7.0
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  intl: ^0.20.2
  collection: ^1.15.0
  characters: ^1.4.0

  # ---------- State ----------
  provider: ^6.0.5

  # ---------- Backend ----------
  supabase_flutter: ^2.5.0

  # ---------- Prayer times ----------
  adhan: ^2.0.0

  # ---------- Local storage ----------
  shared_preferences: ^2.2.0

  # ---------- Config ----------
  flutter_dotenv: ^5.1.0

  # ---------- Notifications ----------
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  just_audio: ^0.9.36

  # ---------- Deep links ----------
  app_links: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

  # ---------- Icon + splash generators ----------
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/athkar/
    - assets/icon/
    # - assets/audio/    # ← Uncomment when you add adhan.mp3

# ============================================
# LAUNCHER ICON
# ============================================
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#071612"
    theme_color: "#D8B65A"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"